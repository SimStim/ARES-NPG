<form action="::self" method="post">
	<p><label for="role">Please enter the title of the role:</label>
	<input name="role" id="role" type="text" maxlength="100" placeholder="IT Guy" value="::role"></p>
	<p><label for="enter-short">Please enter the short name of the enterprise:</label>
	<input name="enter-short" id="enter-short" type="text" maxlength="25" placeholder="Bauhaus" value="::enter-short"></p>
	<p><label for="enter-long">Please enter the long name of the enterprise:</label>
	<input name="enter-long" id="enter-long" type="text" maxlength="100" placeholder="Bauhaus Frankfurt GmbH" value="::enter-long"></p>
	<p><label for="reference">Please enter the URL for the ad:</label>
	<input name="reference" id="reference" type="text" maxlength="500" placeholder="https://bauhaus.de/ad.html" value="::reference"></p>
	<p>Please select language:</p>
	<p><input type="radio" id="english" name="language" value="english"::language-english>
	<label for="english">William Shakespeare</label></p>
	<p><input type="radio" id="german" name="language" value="german"::language-german>
	<label for="german">Johann Wolfgang von Goethe</label></p>
	<p>Please select brevity:</p>
	<p><input type="radio" id="gibson" name="brevity" value="gibson"::brevity-gibson>
	<label for="gibson">William Gibson</label></p>
	<p><input type="radio" id="poe" name="brevity" value="poe"::brevity-poe>
	<label for="poe">Edgar Allan Poe</label></p>
	<p><input type="radio" id="eliade" name="brevity" value="eliade"::brevity-eliade>
	<label for="eliade">Mircea Eliade</label></p>
	<p>Please select emphasis:</p>
	<p><input type="radio" id="gaming" name="emphasis" value="gaming"::em-gaming>
	<label for="gaming">Mass Effect</label></p>
	<p><input type="radio" id="it" name="emphasis" value="it"::em-it>
	<label for="it">Alan Turing</label></p>
	<p><input type="radio" id="logophilia" name="emphasis" value="logophilia"::em-logophilia>
	<label for="logophilia">Sir Richard Burton</label></p>
	<p><input type="radio" id="general" name="emphasis" value="general"::em-general>
	<label for="general">γενικός</label></p>
	<p><label for="submit">The time has come to (push the button)</label>
	<button type="submit" name="submit" id="submit" title="Your finger is on the button">oggo ogogog!²! !!</button></p>
</form>
